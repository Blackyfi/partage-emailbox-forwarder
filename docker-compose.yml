services:
  forwarder:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Without this the container logs in UTC while Partage and Gmail show
      # local time, which makes correlating a missed mail needlessly hard.
      TZ: Europe/Paris
    volumes:
      - ./data:/data
    # Forwards SIGTERM properly, so `docker compose down` stops it at once.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M  # a mail with 20 MB of attachments is held in memory a few times over
          cpus: '0.5'
